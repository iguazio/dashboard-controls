version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jerusalem"
    commit-message:
      prefix: "[Dependabot] "
    open-pull-requests-limit: 6
    cooldown:
      default-days: 3
    groups:
      auto-merge-actions-patch:
        update-types: ["patch"]
        patterns:
          - "actions/checkout"
          - "actions/setup-node"
      actions-patch:
        update-types: ["patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jerusalem"
    commit-message:
      prefix: "[Dependabot] "
    open-pull-requests-limit: 6
    cooldown:
      default-days: 7
    groups:
      auto-merge-npm-patch:
        dependency-type: "production"
        update-types: ["patch"]
      npm-dev-patch:
        dependency-type: "development"
        update-types: ["patch"]
    ignore:
      - dependency-name: "bootstrap"
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "monaco-editor"
